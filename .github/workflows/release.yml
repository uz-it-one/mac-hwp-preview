name: Build and publish release
on:
  push:
    tags:
      - 'v[0-9]*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned dependencies
        run: |
          bash scripts/fetch-wasm.sh
      - name: Test core
        run: swift test --disable-sandbox
      - name: Build and package (adhoc, no Developer ID)
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 scripts/build-app.py
          python3 scripts/package-local.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Never overwrite an existing release or replace its immutable assets.
          gh release create "$RELEASE_TAG" .build/releases/*.zip .build/releases/*.sha256 \
            --verify-tag --draft --title "HWP Preview $RELEASE_TAG" --notes-file release/INSTALL.md
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
